llm_key:
  llamaParse: ''
  deepseek: ''
  xiaoAi: ''
  qwen: ''
  redis: 'redis://127.0.0.1:6379'

llama_parser:
  invalidate_cache: false
  tier: 'agentic'
  version: 'latest'
  timeout_seconds: 180
  max_retries: 2

milvus:
  uri: 'http://127.0.0.1:19530'
  dims: 2560  # qwen向量模型维度

neo4j:
  url: 'bolt://127.0.0.1:7687'
  username: 'neo4j'
  password: ''

ollama:
  base_url: 'http://127.0.0.1:11434'
  embedding_model: 'qwen3-embedding:4b'
  vlm_model: 'qwen2.5vl:3b'

reranker:
  model_path: 'D:/Environment/model/bge-reranker-v2-m3'
  top_n: 8
  use_fp16: true

retrieval:
  candidate_top_k: 30
  backend_candidate_limit: 40
  fusion_candidate_limit: 40
  rrf_k: 60
  timeout_seconds: 20
  max_context_chars: 12000
  max_chunks_per_document: 2

mcp:
  rag_url: 'http://127.0.0.1:8010/rag-retriever'
  web_search_url: ''
  finance_chart_url: ''
  legal_url: ''
  host: '127.0.0.1'
  port: 8010
  log_level: 'info'

auth:
  mode: 'development'
  issuer: 'https://rag-upper.local'
  audience: 'rag-upper-api'
  jwks_url: ''
  public_key_path: 'multi_domain_enterprise_project/mcp_server/public_key'
  private_key_path: 'multi_domain_enterprise_project/mcp_server/private_key'
  algorithms: ['RS256']
  development_user_id: 'user_admin_001'
  development_username: 'admin'
  development_tenant_id: 'tenant_default'
  development_role: 'admin'
  development_permissions: ['chat:use', 'kb:read', 'kb:write', 'kb:delete', 'audit:read']
  token_ttl_seconds: 900

database:
  url: 'sqlite+aiosqlite:///./data/rag_upper.db'
  echo: false

upload:
  max_file_size_bytes: 52428800
  max_attachment_size_bytes: 10485760
  max_files_per_request: 10
  max_attachments_per_request: 5
  allowed_extensions: ['.pdf', '.png', '.jpg', '.jpeg', '.bmp', '.docx', '.pptx', '.xlsx', '.txt', '.md', '.csv', '.json']

runtime:
  environment: 'development'
  request_rate_limit_per_minute: 60
  worker_max_attempts: 3
  worker_block_ms: 5000
  cors_origins: []
  service_name: 'rag-upper-api'
  otel_endpoint: ''
