name: rag-upper

x-app-env: &app-env
  APP_ENV: production
  AUTH_MODE: public_key
  AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER is required}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:?AUTH_AUDIENCE is required}
  AUTH_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
  QWEN_API_KEY: ${QWEN_API_KEY:?QWEN_API_KEY is required}
  LLAMA_PARSE_API_KEY: ${LLAMA_PARSE_API_KEY:?LLAMA_PARSE_API_KEY is required}
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/rag_upper
  REDIS_URL: redis://redis:6379/0
  MILVUS_URI: http://milvus:19530
  NEO4J_URL: bolt://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  RERANKER_MODEL_PATH: /models/reranker
  RERANKER_USE_FP16: "false"
  MCP_RAG_URL: http://mcp:8010/rag-retriever
  MCP_HOST: 0.0.0.0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

services:
  api:
    build: .
    environment: *app-env
    secrets: [jwt_public_key]
    volumes:
      - knowledge_data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["/app/.venv/bin/python", "-m", "multi_domain_enterprise_project.worker"]
    environment: *app-env
    secrets: [jwt_public_key]
    volumes:
      - knowledge_data:/app/data
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    restart: unless-stopped

  migrate:
    build: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: *app-env
    secrets: [jwt_public_key]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  mcp:
    build: .
    command: ["/app/.venv/bin/python", "-m", "multi_domain_enterprise_project.mcp_server.run_mcp"]
    environment: *app-env
    secrets: [jwt_public_key]
    volumes:
      - type: bind
        source: ${RERANKER_MODEL_HOST_PATH:?RERANKER_MODEL_HOST_PATH is required}
        target: /models/reranker
        read_only: true
    depends_on:
      milvus: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rag_upper
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_upper"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    command: minio server /data
    volumes:
      - minio_data:/data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    depends_on: [etcd, minio]
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:2025.06-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

secrets:
  jwt_public_key:
    file: ${AUTH_PUBLIC_KEY_HOST_PATH:?AUTH_PUBLIC_KEY_HOST_PATH is required}

volumes:
  knowledge_data:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
